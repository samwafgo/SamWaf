<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" /> 
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="shortcut icon" type="image/ico" href="/samwaf_captcha/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/samwaf_captcha/css/gocaptcha.global.css">
    <link rel="stylesheet" type="text/css" href="/samwaf_captcha/css/toastify.css">
    <title id="page-title">进行验证</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            color: #3C3C3C;
            background: #EBF3FB;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .example {
            padding: 40px 0;
        }

        .box{
            margin: 30px;
        }

        .lang-switch {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            color: #3C3C3C;
        }

        .lang-switch:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
<button id="lang-switch" class="lang-switch">English</button>
<div class="example">
    <div class="box" id="click-wrap"></div>
</div>
<!-- GoCaptcha -->
<script type="text/javascript" src="/samwaf_captcha/js/gocaptcha.global.js"></script>
<!-- Http Request -->
<script src="/samwaf_captcha/js/axios.js"></script>
<!-- Request parameter serialization-->
<script src="/samwaf_captcha/js/qs.js"></script>
<!-- Toast Tip -->
<script src="/samwaf_captcha/js/toastify.js"></script>

<script type="text/javascript">
    // 语言资源
    const i18n = {
        'zh': {
            title: '进行验证',
            captchaTitle: '请在下图依次点击',
            buttonText: '确认',
            getDataError: '获取数据失败',
            verifySuccess: '验证成功，页面即将刷新...',
            verifyFail: '校验失败',
            switchLang: 'English'
        },
        'en': {
            title: 'Verification',
            captchaTitle: 'Please click in sequence',
            buttonText: 'Confirm',
            getDataError: 'Failed to get data',
            verifySuccess: 'Verification successful, page will refresh...',
            verifyFail: 'Verification failed',
            switchLang: '中文'
        }
    };

    // 语言管理
    const langManager = (function() {
        // Cookie 操作函数
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // 检测浏览器语言
        function detectBrowserLang() {
            const browserLang = navigator.language || navigator.userLanguage;

            return browserLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        let currentLang = getCookie('samwaf_lang') || detectBrowserLang();

        function setLanguage(lang) {
            currentLang = lang;
            setCookie('samwaf_lang', lang, 30); // 保存30天
            applyLanguage();
            return currentLang;
        }

        function getCurrentLang() {
            return currentLang;
        }

        function getText(key) {
            return i18n[currentLang][key] || i18n['en'][key] || key;
        }

        function applyLanguage() {
            // 更新页面标题
            document.getElementById('page-title').textContent = getText('title');

            // 更新语言切换按钮
            document.getElementById('lang-switch').textContent = getText('switchLang');

            // 如果有成功消息，更新它
            const successEl = document.querySelector('.box h3');
            if (successEl) {
                successEl.textContent = getText('verifySuccess');
            }
        }

        return {
            setLanguage,
            getCurrentLang,
            getText,
            applyLanguage
        };
    })();

    // 初始化语言
    langManager.applyLanguage();

    // 语言切换按钮事件
    document.getElementById('lang-switch').addEventListener('click', function() {
        const newLang = langManager.getCurrentLang() === 'zh' ? 'en' : 'zh';
        langManager.setLanguage(newLang);
        // 刷新页面以重新初始化验证码
        window.location.reload();
    });

    // 行为采集模块。
    // 采集结果随交卷请求（botCheck 字段）提交，由服务端校验——
    // 客户端算出的任何"结论"都不可信（脚本可以直接构造请求），
    // 所以这里只如实记录原始信号：鼠标/触摸/指针采样、点击次数、看题到交卷的耗时、自动化环境特征数。
    // 服务端据此拒绝"无头浏览器直接点、没有任何人类交互"这类最省事的自动化。
    const behavior = (function () {
        let mousePoints = 0;
        let touchPoints = 0;
        let pointerPoints = 0;
        let clicks = 0;
        let mouseTrack = [];
        let shownAt = 0;

        // 自动化环境特征计数：命中任意一条即 +1。
        // 只收"出现即异常"的信号，避免把硬件并发数、插件列表这类正常环境也会命中的项算进来造成误伤。
        function detectAutomation() {
            let n = 0;
            try {
                if (navigator.webdriver === true) n++;
                const el = document.documentElement;
                if (el && (el.getAttribute('webdriver') || el.getAttribute('selenium'))) n++;
                if (window._phantom || window.callPhantom || window.__nightmare) n++;
                if (window.domAutomation || window.domAutomationController) n++;
                if (/HeadlessChrome|PhantomJS|Selenium/i.test(navigator.userAgent || '')) n++;
            } catch (e) {
                // 采集失败按"未命中"处理，不打断验证流程
            }
            return n;
        }

        // capture 阶段监听：即便组件内部对事件做了拦截，也能看到经过画布的原始事件
        document.addEventListener('mousemove', function (e) {
            mousePoints++;
            if (mouseTrack.length < 100) {
                mouseTrack.push({ x: e.clientX, y: e.clientY, t: Date.now() - shownAt });
            }
        }, true);
        document.addEventListener('touchstart', function () { touchPoints++; }, true);
        document.addEventListener('touchmove', function () { touchPoints++; }, true);
        // pointerdown/pointermove 兜住触控笔等只发指针事件、不发鼠标/触摸事件的输入设备
        document.addEventListener('pointerdown', function () { pointerPoints++; }, true);
        document.addEventListener('pointermove', function () { pointerPoints++; }, true);
        document.addEventListener('click', function () { clicks++; }, true);

        return {
            // 每次取到新题面时重置：耗时与交互只统计"当前这道题"的
            reset() {
                shownAt = Date.now();
                mousePoints = 0;
                touchPoints = 0;
                pointerPoints = 0;
                clicks = 0;
                mouseTrack = [];
            },
            snapshot() {
                return {
                    v: 1,
                    mousePoints: mousePoints,
                    touchPoints: touchPoints,
                    pointerPoints: pointerPoints,
                    clicks: clicks,
                    mouseTrack: mouseTrack,
                    elapsedMs: shownAt ? Date.now() - shownAt : 0,
                    auto: detectAutomation()
                };
            }
        };
    })();

    axios.defaults.baseURL = '/';

    function toastSuccess(msg) {
        Toastify({
            text: msg,
            duration: 1000,
            newWindow: true,
            gravity: "top",
            position: "center",
            style: {
                background: "#f0f9eb",
                border: "1px solid #dcf9cc",
                color: "#5eaa2f",
                borderRadius: "6px",
                boxShadow: "1px 1px 10px #e0e0e0",
                padding: "8px 20px"
            },
        }).showToast();
    }

    function toastError(msg) {
        Toastify({
            text: msg,
            duration: 1000,
            newWindow: true,
            gravity: "top",
            position: "center",
            style: {
                background: "#fef0f0",
                border: "1px solid #fcd6d6",
                color: "#ed4630",
                borderRadius: "6px",
                boxShadow: "1px 1px 10px #e0e0e0",
                padding: "8px 20px"
            },
        }).showToast();
    }


    // Click
    ;(function (goCaptcha) {
        const getDataApi = "/samwaf_captcha/click_basic";
        const checkDataApi = "/samwaf_captcha/verify";

        const el = document.getElementById("click-wrap");
        const capt = new goCaptcha.Click({
            width: 300,
            height: 220,
            title: langManager.getText('captchaTitle'),
            buttonText: langManager.getText('buttonText'),
        });

        var captKey = ''

        capt.mount(el)

        capt.setEvents({
            click(x, y) {
            },
            confirm(dots, reset) {
                // 行为数据：原始交互信号随交卷请求提交，校验在服务端完成
                const botData = behavior.snapshot();
                // pattern 保留供排查用，服务端暂不校验
                botData.pattern = dots.map(d => ({x: d.x, y: d.y}));

                confirmEvent(dots, botData)
            },
            refresh() {
                capt.clear()
                requestCaptchaData()
            },
            close() {
            }
        })

        const requestCaptchaData = function () {
            capt.clear()
            captKey = ''
            axios({
                method: 'get',
                url: getDataApi,
                params: {
                    lang: langManager.getCurrentLang() // 将当前语言传递给后端
                }
            }).then(function (response) {
                const data = response.data || {};
                if (data && (data['code'] || 0) === 0) {
                    // 新题面到位：重置行为统计（答题耗时从这一刻起算）
                    behavior.reset();
                    capt.setData({
                        image: data['image_base64'] || '',
                        thumb: data['thumb_base64'] || '',
                    })
                    captKey = data['captcha_key'] || ''
                } else {
                    toastError(langManager.getText('getDataError'))
                }
            }).catch((e) => {
                console.warn(e)
            })
        }

        const confirmEvent = function (dots, botData) {
            const dotArr = []
            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i]
                dotArr.push(dot.x, dot.y)
            }

            axios({
                method: 'post',
                url: checkDataApi,
                data: Qs.stringify({
                    dots: dotArr.join(','),
                    key: captKey || '',
                    botCheck: JSON.stringify(botData || {})
                }),
            }).then(function (response) {
                const data = response.data || {};
                if (data && (data['code'] || 0) === 0) {
                    // 隐藏验证码元素
                    document.getElementById("click-wrap").style.display = "none";
                    // 隐藏语言切换按钮
                    document.getElementById("lang-switch").style.display = "none";
                    // 添加成功提示
                    const successEl = document.createElement("div");
                    successEl.className = "box";
                    successEl.innerHTML = "<h3 style='color: #5eaa2f; text-align: center;'>" + langManager.getText('verifySuccess') + "</h3>";
                    document.querySelector(".example").appendChild(successEl);

                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    toastError(langManager.getText('verifyFail'))

                    setTimeout(() => {
                        requestCaptchaData()
                    }, 500)
                }
            }).catch((e) => {
                console.warn(e)
                setTimeout(() => {
                    requestCaptchaData()
                }, 500)
            })
        }

        requestCaptchaData()
    })(window.GoCaptcha || {})

</script>
</body>
