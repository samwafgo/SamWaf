# 安装为 /etc/systemd/system/samwaf.service.d/ebpf.conf。
# 使用独立挂载，不开放共享 /sys/fs/bpf，也不移除其他服务的防火墙。
[Unit]
Requires=samwaf-ebpf-prepare.service
After=samwaf-ebpf-prepare.service

[Service]
EnvironmentFile=/etc/samwaf/ebpf.env
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_BPF
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_BPF
ReadWritePaths=/run/samwaf-bpf
