name: '🐛 Bug Report'
description: 'Report a defect'
title: '[Bug] '
labels: ['🐛 Bug']
assignees:
  - samwafgo
body:
  - type: input
    attributes:
      label: 'Product Version'
      description: The SamWaf version you are using.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: 'Edition'
      options:
        - label: 'Community Edition'
    validations:
      required: true

  - type: textarea
    attributes:
      label: 'Environment'
      description: Please provide a clear and concise description of your environment (OS, deployment method, database, etc.).
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🐛 Bug Description'
      description: |
        Please provide a clear and concise description of the bug. If the problem is complex, describe it in detail.<br/>
        Vague reports may not be processed. Please provide enough detail to allow us to reproduce and fix the issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 'Expected Behavior'
      description: Please provide a clear and concise description of what you expected to happen.

  - type: textarea
    attributes:
      label: 'Additional Information'
      description: Add any other context about the problem here.
